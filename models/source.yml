version: 2

sources:
  - name: nyc_taxi_source
    catalog: samples
    schema: nyctaxi
    tables:
      - name: trips
        description: "Raw NYC Yellow Taxi trip data from Databricks samples catalog"
        columns:
          - name: tpep_pickup_datetime
            description: "Pickup timestamp"
            tests:
              - not_null
          - name: tpep_dropoff_datetime
            description: "Dropoff timestamp"
            tests:
              - not_null
          - name: fare_amount
            description: "Base fare in USD"
            tests:
              - not_null
          - name: total_amount
            description: "Total charge including tips and fees"
          - name: trip_distance
            description: "Trip distance in miles"
          - name: passenger_count
            description: "Number of passengers"
          - name: tip_amount
            description: "Tip amount in USD"
          - name: PULocationID
            description: "Pickup location zone ID"
          - name: DOLocationID
            description: "Dropoff location zone ID"